[project]
name = "kotekomi-exporters"
version = "0.1.0"
description = "Deterministic KoteKomi derived-state exporters."
requires-python = ">=3.12,<3.13"
dependencies = [
  "kotekomi-application",
]

[tool.uv.sources]
kotekomi-application = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kotekomi_exporters"]
