name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-24.04
    env:
      KOTEKOMI_QPDF_EXECUTABLE: /usr/bin/qpdf
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update
      - run: sudo apt-get install --yes poppler-utils qpdf
      - run: ./scripts/verify.sh
