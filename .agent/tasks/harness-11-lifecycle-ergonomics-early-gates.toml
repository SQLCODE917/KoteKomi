legacy_disposition = "Existing H1-H10 commands remain available and exact-output contracts remain stable."
negative_proof = "H11 must not change verification-plan, run-check, verify-checks, receipt schema, task manifest schema, or GitHub CI behavior."
public_entry_point = "kotekomi-agent lifecycle-check"
scope_policy = "Only lifecycle CLI/help, task_lifecycle behavior, compact AGENTS guidance, and lifecycle tests may change in the candidate."
side_effect_boundary = "lifecycle-check remains read-only; tests must not require network, GitHub, global repository state, commits, or pushes."
unresolved_decisions = []

[budget]
maximum_production_files = 3
maximum_test_files = 2
maximum_production_diff_lines = 420

