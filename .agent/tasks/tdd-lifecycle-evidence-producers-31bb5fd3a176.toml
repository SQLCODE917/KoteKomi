]
stop_conditions = [
  "a lifecycle producer mutates Git, branches, remotes, or CI state",
  "invalid lifecycle input writes canonical evidence",
  "workflow accepts CI evidence for a different lifecycle commit",
  "workflow accepts a main merge whose verified parent is not the candidate commit",
  "verification-plan leaves a changed lifecycle-producer path uncovered"
]

[readiness]
authority = "The Lifecycle Evidence Producers TDD defines the producer interfaces and workflow behavior."
contract_family = "tdd-harness"
dominant_outcome = "Every lifecycle phase has deterministic, canonical evidence from a named Harness command."
failure_policy = "Invalid Git and CI facts block before evidence is written; valid failed CI and incomplete cleanup facts remain recorded."
legacy_disposition = "Existing evidence catalog, lifecycle check, verification execution, and workflow commands remain retained."
negative_proof = "The commands never delete branches, modify Git state, call a CI service, or fabricate lifecycle evidence."
public_entry_point = "kotekomi-agent record-candidate-commit"
scope_policy = "Only lifecycle producers, workflow selection, verification coverage, focused tests, and required documentation may change."
side_effect_boundary = "Producer commands write only canonical state-root evidence, evidence index/event records, and explicitly requested report copies."
unresolved_decisions = []

[budget]
maximum_production_files = 4
maximum_test_files = 4
maximum_production_diff_lines = 1200

