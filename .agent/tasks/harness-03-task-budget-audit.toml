legacy_disposition = "H1 validation and H2 preflight remain unchanged and active."
negative_proof = "Over-budget and out-of-scope candidate diffs fail deterministically."
public_entry_point = "kotekomi-agent budget-audit"
scope_policy = "Read-only Git diff budget audit for one Task Manifest."
