  "packages/devtools/src/kotekomi_devtools/evidence_catalog.py"
]
stop_conditions = [
  "the implementation deletes a feature ref before a matching result tag exists",
  "the implementation deletes a local or remote ref whose commit differs from the expected feature tip",
  "the implementation uses an unrestricted local or remote feature-ref deletion",
  "the implementation changes promotion or result-tag contracts",
  "the implementation changes the protected leaf TDD or task manifest"
]

[readiness]
authority = "The Compare-and-Delete Feature Cleanup TDD defines this task."
contract_family = "tdd-harness"
dominant_outcome = "The Harness removes a tagged abandoned feature branch without requiring the branch to merge into main."
failure_policy = "A local or remote ref mismatch retains that ref and writes incomplete cleanup evidence."
legacy_disposition = "Merge-only local branch deletion is replaced by compare-and-delete ref deletion."
negative_proof = "The producer never deletes a ref without its recorded expected feature tip."
public_entry_point = "kotekomi-agent abandon-feature-branch"
scope_policy = "Feature cleanup comparison, lease enforcement, and disposable-Git contract tests only."
side_effect_boundary = "Annotated task tags, named local feature refs, named remote feature refs, and canonical cleanup evidence only."
unresolved_decisions = []

