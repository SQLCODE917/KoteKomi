stop_conditions = ["task manifest schema changed", "protected receipt changed", "protected H7 acceptance test changed", "H6 lifecycle behavior changed", "write-receipt mutates git, network, or files beyond requested output"]

[readiness]
authority = "The H7 leaf TDD and protected acceptance oracle define the write-receipt command contract."
contract_family = "agent-harness"
dominant_outcome = "A local write-receipt command writes deterministic canonical JSON receipts with validated input record and artifact hashes."
failure_policy = "Missing or invalid receipt inputs exit nonzero; overwrite without --force exits nonzero without changing the existing receipt."
legacy_disposition = "Existing H1-H6 commands remain unchanged and H6 lifecycle-check continues to consume candidate records."
negative_proof = "The command must not call GitHub, run tests, switch branches, stage files, create commits, push, or mutate files other than the requested receipt."
public_entry_point = "kotekomi-agent write-receipt"
scope_policy = "Only the CLI, receipt writer module, and receipt writer unit tests may change in the candidate."
side_effect_boundary = "The only allowed filesystem mutation is creating or overwriting the requested receipt output when policy allows it."
unresolved_decisions = []

[budget]
maximum_production_files = 2
maximum_test_files = 1
maximum_production_diff_lines = 450

