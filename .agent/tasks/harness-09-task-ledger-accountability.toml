[readiness]
authority = "The H9 hub and leaf TDD documents define the task-ledger accountability and goal accountability command contracts."
contract_family = "agent-harness"
dominant_outcome = "Local commands goal-check and task-ledger write deterministic JSON and Markdown or ledger outputs, enforce goal coverage, and keep roadmap state outside implementation-agent context."
failure_policy = "Invalid goal coverage, missing evidence, incomplete deferrals, or invalid task completion exits nonzero with deterministic diagnostics."
legacy_disposition = "Existing H1-H8 commands remain available; H8 task-retrospective may be refined only to support H9 retrospective accountability metrics."
negative_proof = "The new commands must not call GitHub, switch branches, stage files, create commits, push, invoke Terra, or infer task state from agent context."
public_entry_point = "kotekomi-agent goal-check and kotekomi-agent task-ledger"
scope_policy = "Only the CLI, goal accountability module, task ledger module, and H9 unit tests may change in the candidate."
side_effect_boundary = "goal-check may write only its requested JSON and Markdown outputs; task-ledger update may write only the requested ledger output."
unresolved_decisions = []

[budget]
maximum_production_files = 3
maximum_test_files = 2
maximum_production_diff_lines = 650

