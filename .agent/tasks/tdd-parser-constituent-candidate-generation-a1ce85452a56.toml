[readiness]
authority = "The R3 TDD defines the parser-derived constituent inventory, the exact-span Boundary Fidelity census, the finite selection contract, and the Constituent Pool Ceiling measurement."
contract_family = "source-grounded-attachment-deterministic-first"
dominant_outcome = "Every Event yields one model-free Constituent Candidate Inventory with a Boundary Fidelity census and pool ceiling recorded per partition, and the local model returns one finite selection per Event without drawing a boundary."
failure_policy = "A changed Gold, source, or Stanza digest, an invent-characters requirement, or a corrected-Gold re-derivation divergence stops the runner."
legacy_disposition = "The CEA-1 boundary-drawing route stays unused and the R2 corrected Gold is re-derived without migrating CEA-1 artifacts."
negative_proof = "The inventory builder reads no Gold, so a missed Gold fragment is reported, never silently repaired."
public_entry_point = "scripts/run_parser_constituent_candidate_generation.py"
scope_policy = "Parser-constituent generation, boundary fidelity, finite selection, and focused tests only; the held-out partition stays reserved."
side_effect_boundary = "The runner writes one constituent inventory file and experiment report artifacts only under its explicit run root; model output never becomes accepted state."
unresolved_decisions = []

[budget]
