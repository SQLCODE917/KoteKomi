[readiness]
authority = "The R2 TDD defines the foreign-trigger detection rule, the source-exact resize, the exact-fragment relabel, and the before-and-after error-class re-score."
contract_family = "source-grounded-attachment-deterministic-first"
dominant_outcome = "Every trigger-containment candidate yields exactly one resized candidate, the corrected Attachment Gold re-labels it by exact fragment membership, and the R1 error classes are recounted against the corrected Gold on both partitions."
failure_policy = "A changed Proposition Gold, trigger Gold, source, or Stanza digest, or a trigger that cannot be materialized to exact source characters, stops the runner; a segmentation artifact is never silently relabeled."
legacy_disposition = "The original Proposition Gold is left untouched and one new corrected Attachment Gold file is added; no CEA-1.2 split-proposal artifact is migrated."
negative_proof = "An Event that owns a contained trigger is never classified foreign, so a trigger's own Event cannot be relabeled away by containment."
public_entry_point = "scripts/run_trigger_containment_candidate_split.py"
scope_policy = "Model-free split, Gold correction, re-score, and focused tests only; the held-out partition stays reserved and unread."
side_effect_boundary = "The runner writes one corrected Attachment Gold reference file and only experiment report artifacts under its explicit run root."
unresolved_decisions = []

