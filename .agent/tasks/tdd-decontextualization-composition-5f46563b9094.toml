[readiness]
authority = "The R4 TDD defines the deterministic content-triple and attribution assembly from the Selected Constituent Set, the relation label derived from the trigger token only, and the typed holds."
contract_family = "source-grounded-attachment-deterministic-first"
dominant_outcome = "Every Event yields one DecontextualizedProposition carrying one content triple and one attribution, or one typed hold, with zero model executions, zero canonical writes, and zero ProposedChanges."
failure_policy = "A drifted input digest, a constituent that cannot materialize to exact source characters, or any model-derived relation label stops the runner; a fabricated role is never emitted."
legacy_disposition = "The CEA-1 boundary-drawing and inline Y/N route stays unused; the deterministic composer reuses the D3 attribution split and the D1/D4 content-triple field naming without migrating CEA-1 artifacts."
negative_proof = "A rejected, empty, or incomplete selection holds with a typed reason and never fabricates a subject, object, or attribution target."
public_entry_point = "scripts/run_decontextualization_composition.py"
scope_policy = "Deterministic composition, typed holds, report generation, and focused tests only; the held-out partition stays reserved and unread."
side_effect_boundary = "The runner writes only experiment report artifacts under its explicit run root; model output never becomes accepted state."
unresolved_decisions = []

[budget]
