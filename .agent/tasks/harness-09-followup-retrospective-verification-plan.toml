[readiness]
authority = "The H9 follow-up docs define the deterministic verification-plan command and minimal AGENTS guidance."
contract_family = "agent-harness"
dominant_outcome = "verification-plan computes required local checks from manifest acceptance, retained checks, quality checks, and low-maintenance touched-path rules."
failure_policy = "Uncovered changed paths exit nonzero with deterministic diagnostics and write deterministic JSON and Markdown outputs."
legacy_disposition = "Existing H1-H9 commands remain available and exact-output CLI contracts remain stable."
negative_proof = "verification-plan must not run tests, call GitHub, switch branches, stage files, create commits, push, invoke Terra, or infer completion from agent context."
public_entry_point = "kotekomi-agent verification-plan"
scope_policy = "Only CLI registration, verification_plan module, compact AGENTS guidance, a narrow lifecycle compatibility repair, and verification-plan unit tests may change in the candidate."
side_effect_boundary = "verification-plan may write only the requested JSON and Markdown report outputs."
unresolved_decisions = []

[budget]
maximum_production_files = 3
maximum_test_files = 1
maximum_production_diff_lines = 450

