contract_family = "agent-harness"
dominant_outcome = "receipt-chain status is computed from receipt files and expected digests, not agent memory."
failure_policy = "Missing receipts, unreadable receipts, and digest mismatches produce nonzero status and diagnostics."
legacy_disposition = "H9 through H14 verification, lifecycle, step-script, delimiter, and coverage contracts remain retained."
negative_proof = "The command must not write receipts, mutate Git, call GitHub, or infer completion from agent context."
public_entry_point = "kotekomi-agent receipt-chain-status"
scope_policy = "Only the CLI status command, focused tests, and compact guidance may change."
side_effect_boundary = "receipt-chain-status is read-only except for explicitly requested output files."
unresolved_decisions = []

