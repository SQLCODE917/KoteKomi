goal = "Make required verification-plan checks auditable by recording check execution and verifying that every required check ran successfully."
depends_on = ["harness-01-task-manifest-contract", "harness-02-task-preflight", "harness-03-task-budget-audit", "harness-04-task-scope-audit"]
allowed_paths = [
  "packages/devtools/src/kotekomi_devtools/cli.py",
  "packages/devtools/src/kotekomi_devtools/verification_execution.py",
  "packages/devtools/AGENTS.md",
  "packages/devtools/tests/unit/test_verification_execution.py",
]
reference_paths = [
  "docs/agent-harness/h10/README.md",
  "docs/agent-harness/h10/acceptance-criteria.md",
  "docs/agent-harness/h10/dogfood-plan.md",
  "docs/agent-harness/h10/tdd.md",
  "packages/devtools/src/kotekomi_devtools/verification_plan.py",
  "packages/devtools/src/kotekomi_devtools/task_manifest.py",
  "packages/devtools/src/kotekomi_devtools/task_preflight.py",
  "packages/devtools/src/kotekomi_devtools/task_lifecycle.py",
  "packages/devtools/src/kotekomi_devtools/receipt_writer.py",
]
stop_conditions = [
  "task manifest schema changed",
  "protected H10 docs changed",
  "protected verification-execution acceptance test changed after spec",
  "run-check executes through a shell string instead of argv",
  "verify-checks accepts missing, failed, duplicate, malformed, or command-mismatched planned checks",
  "candidate manually infers or substitutes required verification-plan checks",
]

[readiness]
authority = "The H10 docs define deterministic verification execution accountability and the required run-check and verify-checks commands."
contract_family = "agent-harness"
dominant_outcome = "run-check records exact check execution and verify-checks proves every required verification-plan check succeeded."
failure_policy = "Missing, failed, duplicate, malformed, command-mismatched, and extra records produce deterministic not_ready diagnostics."
legacy_disposition = "Existing H1-H9 and H9-followup commands remain available and exact-output contracts remain stable."
negative_proof = "verify-checks must not run tests, call GitHub, switch branches, stage files, create commits, push, invoke Terra, or infer completion from agent context."
public_entry_point = "kotekomi-agent run-check and kotekomi-agent verify-checks"
scope_policy = "Only CLI registration, verification_execution module, compact AGENTS guidance, and verification-execution unit tests may change in the candidate."
side_effect_boundary = "run-check may write only the requested log and record; verify-checks may write only the requested JSON and Markdown reports."
unresolved_decisions = []

[budget]
maximum_production_files = 3
maximum_test_files = 1
maximum_production_diff_lines = 550

